org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Required by flutter_v2ray native libs packaging
# android.bundle.enableUncompressedNativeLibs=false

# Opt out of AGP9 new-DSL and built-in Kotlin (Flutter's official migration for
# AGP 8.9+/Flutter 3.4x). Kept for safety with legacy plugins (agora, isar,
# device_apps). Primary fix for the "Cannot run Project.afterEvaluate already
# evaluated" error is android/build.gradle's `subprojects { evaluationDependsOn(":app") }`.
android.newDsl=false
android.builtInKotlin=false
