org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official

# Required by flutter_v2ray native libs packaging
# android.bundle.enableUncompressedNativeLibs=false

# [FIX 2026-09-02] agora_rtc_engine + AGP 8.10 (Flutter 3.41.x) triggers the
# "Cannot run Project.afterEvaluate already evaluated" error. Flutter's official
# AGP migration (docs.flutter.dev/.../migrate-to-built-in-kotlin) says to opt out
# of both AGP 9 new-DSL and built-in Kotlin in gradle.properties. The prior
# attempt only set android.newDsl=false; android.builtInKotlin=false was missing.
android.newDsl=false
android.builtInKotlin=false
