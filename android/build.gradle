// Put the Android Gradle Plugin on the buildscript classpath so that
// third-party Flutter plugins using the LEGACY `apply plugin: 'com.android.library'`
// syntax (e.g. agora_rtc_engine) can resolve it.
// Without this they fail with: "Plugin with id 'com.android.library' not found."
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Force all Android library subprojects to use compileSdk 36.
// This fixes "resource android:attr/lStar not found" errors from plugins
// like isar_flutter_libs that target older SDKs.
// IMPORTANT: use afterEvaluate (deferred), NOT plugins.withId inside
// subprojects{}. plugins.withId eagerly evaluates library subprojects,
// which breaks the Flutter Gradle plugin's afterEvaluate lifecycle hook
// with: "Cannot run Project.afterEvaluate when the project is already evaluated."
subprojects { sub ->
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin("com.android.library")) {
            sub.android {
                compileSdkVersion 36
                if (namespace == null || namespace.toString().trim().isEmpty()) {
                    namespace = "cdn.example.${sub.name}"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
